name: Check Pirozhok app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Seed test database
        env:
          DATABASE_PATH: /tmp/pirozhok-ci.db
          ADMIN_PASSWORD: ci-only-password
        run: npm run db:seed
      - name: Build Next.js app
        env:
          DATABASE_PATH: /tmp/pirozhok-ci.db
        run: npm run build
