name: Check Pirozhok app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public demo JavaScript
        run: |
          node --check docs/backend.js
          node --check docs/app1.js
          node --check docs/app2.js
          node --check docs/app3.js
          node --check docs/api-mode.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Seed test database
        env:
          DATABASE_PATH: /tmp/pirozhok-ci.db
          ADMIN_PASSWORD: ci-only-password
        run: npm run db:seed
      - name: Build Next.js app
        env:
          PIROZHOK_BUILD: '1'
        run: npm run build
      - name: Runtime health smoke test
        env:
          DATABASE_PATH: /tmp/pirozhok-ci.db
          PORT: 3000
        run: |
          npm start > /tmp/pirozhok-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pirozhok-server.log
          exit 1
