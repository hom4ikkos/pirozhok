<style>
:root{--bg:#09090d;--panel:#101016;--panel2:#17171f;--line:#292934;--muted:#9292a2;--accent:#ff9a51;--navh:68px}
*{box-sizing:border-box}html,body{margin:0;background:#060608;color:#f7f7fa;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}button,input{font:inherit}.app{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);position:relative}.top{position:sticky;top:0;z-index:30;padding:15px 16px 12px;background:#09090de8;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:950;letter-spacing:-.5px}.brand b{color:var(--accent)}.topbadge{font-size:10px;color:#bbb;background:#181820;border:1px solid #292934;padding:6px 8px;border-radius:999px}.page{display:none;padding:0 14px calc(var(--navh) + 22px)}.page.on{display:block}.page.shortsPage{padding:0 0 var(--navh);height:calc(100dvh - 56px);overflow:hidden}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin:8px 0 12px}.sectionHead h2{margin:0;font-size:21px}.small{font-size:12px;color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 15px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip,.btn{border:1px solid var(--line);background:var(--panel2);color:#ddd;border-radius:999px;padding:8px 11px;white-space:nowrap}.chip.on,.btn.on{background:#fff;color:#111;border-color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 10px}.card{cursor:pointer;min-width:0}.thumb{aspect-ratio:16/10;border-radius:14px;background:linear-gradient(135deg,#34241c,#171720);position:relative;overflow:hidden;border:1px solid #1e1e26}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb:after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;font-size:25px;color:#fff;text-shadow:0 2px 12px #000;opacity:.92}.thumb:before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,#0009);z-index:1}.thumb:after,.dur{z-index:2}.dur{position:absolute;right:7px;bottom:7px;background:#000c;padding:3px 6px;border-radius:6px;font-size:10px}.t{font-weight:850;margin:7px 0 4px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.m{font-size:11px;color:var(--muted);line-height:1.4}.authorline{display:flex;gap:6px;align-items:center;margin-top:4px}.miniav{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#292935;font-size:9px;font-weight:900;color:#fff}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(4,1fr);background:#0d0d13f2;border-top:1px solid #292934;padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:50;backdrop-filter:blur(18px)}.nav button{border:0;background:none;color:#777;font-size:10px;padding:2px}.nav button.on{color:#fff}.nav span{display:block;font-size:20px;margin-bottom:2px}.shortFeed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000}.shortFeed::-webkit-scrollbar{display:none}.short{height:100%;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#121218}.short video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.shade{position:absolute;inset:0;background:linear-gradient(#0002 0%,transparent 35%,#000c 88%);pointer-events:none}.shorttxt{position:absolute;left:15px;right:76px;bottom:20px;z-index:2;text-shadow:0 2px 10px #000}.shorttxt b{font-size:15px}.shorttxt p{margin:6px 0 0;line-height:1.35}.side{position:absolute;right:12px;bottom:18px;z-index:3;display:grid;gap:11px;text-align:center}.circle{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff20;background:#17171fd9;color:#fff;font-size:19px;backdrop-filter:blur(10px)}.circle.on{background:#fff;color:#111}.count{font-size:10px;color:#fff;margin-top:-7px;text-shadow:0 1px 5px #000}.sound{position:absolute;right:12px;top:14px;z-index:4;width:38px;height:38px;border:0;border-radius:50%;background:#111a;color:white}.shortIndex{position:absolute;left:14px;top:15px;z-index:4;background:#0008;border:1px solid #fff2;border-radius:999px;padding:5px 8px;font-size:10px}.tapHint{position:absolute;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none;font-size:54px;opacity:0;transition:.15s;text-shadow:0 2px 20px #000}.tapHint.show{opacity:.9}.search,input{width:100%;background:#15151c;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}.person{display:flex;align-items:center;gap:10px;padding:11px;background:#15151c;border:1px solid #22222b;border-radius:14px;margin:8px 0}.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#292935;font-weight:900}.grow{flex:1;min-width:0}.profile{text-align:center;padding:22px 0 18px}.profile .av{width:78px;height:78px;margin:auto;font-size:24px;background:linear-gradient(135deg,#ff9a51,#7c4dff)}.statrow{display:flex;justify-content:center;gap:28px;margin-top:14px}.stat b{display:block;font-size:17px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin-bottom:12px}.tabs button{border:0;background:none;color:#777;padding:12px}.tabs button.on{color:#fff;border-bottom:2px solid #fff}.row{padding:14px;background:#15151c;border:1px solid var(--line);border-radius:13px;margin:8px 0}.overlay{position:fixed;inset:0;background:#000b;z-index:80;display:none;align-items:flex-end;justify-content:center}.overlay.on{display:flex}.sheet{width:min(100%,480px);max-height:94dvh;overflow:auto;background:#111117;border-radius:22px 22px 0 0;padding:15px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.x{float:right;border:0;border-radius:50%;width:34px;height:34px;background:#24242d;color:#fff;font-size:20px}.playerWrap{position:relative;margin-top:10px}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;display:block}.acts{display:flex;gap:8px;overflow:auto;margin:12px 0;scrollbar-width:none}.acts::-webkit-scrollbar{display:none}.comment{padding:10px 0;border-bottom:1px solid #22222a}.send{display:flex;gap:7px}.send input{min-width:0}.send button,.white{border:0;border-radius:11px;background:#fff;color:#111;padding:10px 13px;font-weight:900}.auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#3a2116,#09090d 48%)}.auth.hide{display:none}.box{width:min(100%,390px);background:#121218;border:1px solid var(--line);border-radius:22px;padding:22px}.box input{margin:5px 0}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 13px;border-radius:999px;z-index:120;display:none;font-size:12px;font-weight:850;white-space:nowrap}.toast.on{display:block}.chat{display:none}.chat.on{display:block}.messages{height:52dvh;overflow:auto;padding:10px 0}.bubble{max-width:80%;background:#20202a;padding:9px 11px;border-radius:13px;margin:7px 0}.bubble.me{margin-left:auto;background:#fff;color:#111}.chatVideo{display:flex;gap:9px;align-items:center;background:#15151c;border:1px solid #292934;border-radius:12px;padding:7px;margin-top:7px;cursor:pointer}.chatVideo img{width:76px;aspect-ratio:16/10;object-fit:cover;border-radius:8px}.folder{display:flex;align-items:center;gap:12px}.folderIcon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#24242e}.folderPick{display:grid;gap:8px;margin-top:12px}.folderBtn{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:#17171f;color:#fff;padding:12px;border-radius:13px}.empty{padding:24px 14px;text-align:center;color:var(--muted);border:1px dashed #30303b;border-radius:14px}.hero{margin:0 0 16px;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/8;background:#15151c;border:1px solid #22222b}.hero img{width:100%;height:100%;object-fit:cover}.hero .heroShade{position:absolute;inset:0;background:linear-gradient(90deg,#000c 0%,#0005 55%,transparent)}.heroText{position:absolute;left:15px;bottom:14px;right:90px}.heroText h2{margin:4px 0;font-size:21px}.pill{display:inline-block;background:#fff;color:#111;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.createFolder{display:flex;gap:8px;margin-top:10px}.createFolder input{flex:1}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">🥟 Piro<b>zhok</b></div><div class="topbadge">DEMO v0.2</div></header>
<main>
<section id="home" class="page on"><div id="chips" class="chips"></div><div id="hero"></div><div class="sectionHead"><h2>New</h2><span class="small" id="newCount"></span></div><div id="grid" class="grid"></div></section>
<section id="shorts" class="page shortsPage"><div id="shortFeed" class="shortFeed"></div></section>
<section id="friends" class="page"><div id="fl"><div class="sectionHead"><h2>Friends</h2><span class="small">1-on-1 chats</span></div><input class="search" placeholder="Search @username" oninput="people(this.value)"><p class="small">Demo chats live only on this device.</p><div id="plist"></div></div><div id="chat" class="chat"><button class="btn" onclick="closeChat()">← Back</button><h3 id="chatname"></h3><div id="msgs" class="messages"></div><form class="send" onsubmit="sendMsg(event)"><input id="msg" placeholder="Message…"><button>Send</button></form></div></section>
<section id="profile" class="page"><div class="profile"><div id="pav" class="av">P</div><h2 id="pn">Pirozhok User</h2><div id="ph" class="small">@pirozhok</div><div class="statrow"><div class="stat"><b id="statLikes">0</b><span class="small">Likes</span></div><div class="stat"><b id="statSaved">0</b><span class="small">Saved</span></div><div class="stat"><b>3</b><span class="small">Friends</span></div></div></div><div class="tabs"><button class="on" onclick="ptab(this,'saved')">Saved</button><button onclick="ptab(this,'liked')">Likes</button><button onclick="ptab(this,'folders')">Folders</button></div><div id="saved"></div><div id="liked" style="display:none"></div><div id="folders" style="display:none"></div><div class="row">⚙ Settings <span class="small">(later)</span></div><div class="row" onclick="logout()">Log out</div></section>
</main></div>
<nav class="nav"><button class="on" data-p="home"><span>⌂</span>Home</button><button data-p="shorts"><span>▶</span>Shorts</button><button data-p="friends"><span>☺</span>Friends</button><button data-p="profile"><span>●</span>Profile</button></nav>
<div id="videoModal" class="overlay"><div class="sheet"><button class="x" onclick="closeVideo()">×</button><div id="detail"></div></div></div>
<div id="folderModal" class="overlay"><div class="sheet"><button class="x" onclick="closeFolderPicker()">×</button><h2>Save to folder</h2><div id="folderPick" class="folderPick"></div><div class="createFolder"><input id="newFolder" placeholder="New folder name"><button class="white" onclick="createFolder()">Create</button></div></div></div>
<div id="shareModal" class="overlay"><div class="sheet"><button class="x" onclick="shareModal.classList.remove('on')">×</button><h2>Send to a friend</h2><div id="sharePeople"></div></div></div>
<div id="toast" class="toast"></div>
<div id="auth" class="auth"><div class="box"><h1>🥟 Pirozhok</h1><p class="small">Local demo account — no email confirmation.</p><input id="name" placeholder="Display name"><input id="user" placeholder="Username"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="white" style="width:100%;margin-top:8px" onclick="register()">Create account</button><button class="btn" style="width:100%;margin-top:8px" onclick="demoLogin()">Use demo login</button></div></div>
<script>
const IMG='https://storage.googleapis.com/gtv-videos-bucket/sample/images/';
const VIDEO={flower:'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',bunny:'https://www.w3schools.com/html/mov_bbb.mp4',bbb:'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4',sintel:'https://test-videos.co.uk/vids/sintel/mp4/h264/720/Sintel_720_10s_2MB.mp4'};
const V=[
{id:'1',cat:'Category 1',title:'First Pirozhok upload',author:'Mira Lane',user:'mira',dur:'8:24',likes:842,dislikes:13,views:'12K',img:IMG+'BigBuckBunny.jpg',src:VIDEO.bunny},
{id:'2',cat:'Category 2',title:'Building something weird',author:'Alex North',user:'alex',dur:'14:02',likes:504,dislikes:21,views:'8.4K',img:IMG+'ElephantsDream.jpg',src:VIDEO.sintel},
{id:'3',cat:'Category 3',title:'Night city walk',author:'Noah Gray',user:'noah',dur:'42:10',likes:2204,dislikes:47,views:'31K',img:IMG+'ForBiggerEscapes.jpg',src:VIDEO.flower},
{id:'4',cat:'Category 1',title:'Tiny studio, big ideas',author:'Mira Lane',user:'mira',dur:'11:37',likes:318,dislikes:8,views:'4.1K',img:IMG+'ForBiggerFun.jpg',src:VIDEO.bbb},
{id:'5',cat:'Category 4',title:'Why this UI feels fast',author:'Lena Fox',user:'lena',dur:'6:55',likes:1290,dislikes:32,views:'18K',img:IMG+'Sintel.jpg',src:VIDEO.sintel},
{id:'6',cat:'Category 5',title:'The weekend experiment',author:'Alex North',user:'alex',dur:'23:18',likes:733,dislikes:17,views:'9.7K',img:IMG+'TearsOfSteel.jpg',src:VIDEO.flower},
{id:'7',cat:'Category 2',title:'I tried making a film in one day',author:'Noah Gray',user:'noah',dur:'17:46',likes:1660,dislikes:19,views:'22K',img:IMG+'ForBiggerJoyrides.jpg',src:VIDEO.bunny},
{id:'8',cat:'Category 3',title:'A very unnecessary camera test',author:'Lena Fox',user:'lena',dur:'9:13',likes:987,dislikes:15,views:'13K',img:IMG+'ForBiggerBlazes.jpg',src:VIDEO.bbb}
];
const SHORTS=[
{id:'s1',author:'mira',text:'A tiny flower film. Swipe up for the next one.',src:VIDEO.flower,poster:IMG+'ForBiggerFun.jpg',likes:1240,dislikes:14},
{id:'s2',author:'alex',text:'Testing the vertical feed with a bunny cameo.',src:VIDEO.bbb,poster:IMG+'BigBuckBunny.jpg',likes:843,dislikes:9},
{id:'s3',author:'lena',text:'Ten seconds of Sintel, cropped into a phone-first short.',src:VIDEO.sintel,poster:IMG+'Sintel.jpg',likes:2031,dislikes:22},
{id:'s4',author:'noah',text:'One more clip so the feed actually feels like a feed.',src:VIDEO.bunny,poster:IMG+'ElephantsDream.jpg',likes:694,dislikes:6}
];
const P=[['Mira Lane','mira','M'],['Alex North','alex','A'],['Noah Gray','noah','N'],['Lena Fox','lena','L']];
let cat='All',cur=null,who=null,pendingSave=null,pendingShare=null,shortObserver=null;
const BASE={l:{},d:{},comments:{},msgs:{},folders:{Favorites:[]},shortSound:false};
function S(){let raw={};try{raw=JSON.parse(localStorage.pzstate||'{}')}catch{};let s={...BASE,...raw};s.l=s.l||{};s.d=s.d||{};s.comments=s.comments||{};s.msgs=s.msgs||{};s.folders=s.folders||{Favorites:[]};if(!Object.keys(s.folders).length)s.folders={Favorites:[]};if(raw.save){let old=Object.keys(raw.save).filter(k=>raw.save[k]&&k!=='short');s.folders.Favorites=[...new Set([...(s.folders.Favorites||[]),...old])]}return s}
function put(s){localStorage.pzstate=JSON.stringify(s);profile()}
function allSaved(s=S()){return [...new Set(Object.values(s.folders).flat())]}
function chips(){let a=['All','Category 1','Category 2','Category 3','Category 4','Category 5'];chipsEl.innerHTML=a.map(x=>`<button class="chip ${x===cat?'on':''}" onclick="cat='${x}';chips();grid()">${x}</button>`).join('')}
const chipsEl=document.getElementById('chips');
function imgTag(v){return `<img src="${v.img}" alt="${esc(v.title)}" loading="lazy" onerror="this.style.display='none'">`}
function card(v){return `<div class="card" onclick="openVideo('${v.id}')"><div class="thumb">${imgTag(v)}<span class="dur">${v.dur}</span></div><div class="t">${v.title}</div><div class="authorline"><span class="miniav">${v.author[0]}</span><div class="m">${v.author} · ${v.views} views</div></div></div>`}
function grid(){let a=cat==='All'?V:V.filter(v=>v.cat===cat);newCount.textContent=`${a.length} videos`;gridEl.innerHTML=a.map(card).join('');let h=a[0]||V[0];hero.innerHTML=`<div class="hero" onclick="openVideo('${h.id}')"><img src="${h.img}" onerror="this.style.display='none'"><div class="heroShade"></div><div class="heroText"><span class="pill">FEATURED</span><h2>${h.title}</h2><div class="small">${h.author} · ${h.views} views</div></div></div>`}
const gridEl=document.getElementById('grid');
function openVideo(id){cur=id;let v=V.find(x=>x.id===id),s=S(),cs=s.comments[id]||[],saved=allSaved(s).includes(id);detail.innerHTML=`<div class="playerWrap"><video id="mainPlayer" class="player" controls playsinline poster="${v.img}" src="${v.src}"></video></div><h2>${v.title}</h2><div class="m">${v.views} views · ${v.cat}</div><div class="row"><b>${v.author}</b><div class="m">@${v.user} · creator</div></div><div class="acts"><button class="btn ${s.l[id]?'on':''}" onclick="react('${id}','l')">♥ ${v.likes+(s.l[id]?1:0)}</button><button class="btn ${s.d[id]?'on':''}" onclick="react('${id}','d')">↓ ${v.dislikes+(s.d[id]?1:0)}</button><button class="btn ${saved?'on':''}" onclick="openFolderPicker('${id}')">▣ ${saved?'Saved':'Save'}</button><button class="btn" onclick="openShare('${id}')">↗ Send</button></div><h3>Comments</h3><form class="send" onsubmit="comment(event,'${id}')"><input id="ci" placeholder="Add comment"><button>Post</button></form>${cs.length?cs.map(c=>`<div class="comment"><b>${esc(c.n)}</b><div>${esc(c.t)}</div></div>`).join(''):'<div class="empty" style="margin-top:10px">No comments yet. Be the first.</div>'}`;videoModal.classList.add('on')}
function closeVideo(){videoModal.classList.remove('on');let p=document.getElementById('mainPlayer');if(p)p.pause();cur=null}
function react(id,t){let s=S();s[t][id]=!s[t][id];if(s[t][id])delete s[t==='l'?'d':'l'][id];put(s);if(cur===id)openVideo(id);if(id.startsWith('s'))renderShortButtons(id)}
function comment(e,id){e.preventDefault();let input=document.getElementById('ci'),x=input.value.trim();if(!x)return;let s=S();(s.comments[id]??=[]).unshift({n:U()?.name||'You',t:x});put(s);openVideo(id)}
function openFolderPicker(id){pendingSave=id;renderFolderPicker();folderModal.classList.add('on')}
function closeFolderPicker(){folderModal.classList.remove('on');pendingSave=null}
function renderFolderPicker(){let s=S();folderPick.innerHTML=Object.entries(s.folders).map(([name,ids])=>`<button class="folderBtn" onclick="toggleFolder('${jsq(name)}')"><span>📁 ${esc(name)}</span><b>${ids.includes(pendingSave)?'✓':''}</b></button>`).join('')}
function toggleFolder(name){let s=S(),a=s.folders[name]||[];if(a.includes(pendingSave))a=a.filter(x=>x!==pendingSave);else a=[pendingSave,...a];s.folders[name]=a;put(s);renderFolderPicker();toast(a.includes(pendingSave)?`Saved to ${name}`:`Removed from ${name}`);if(cur===pendingSave)openVideo(cur)}
function createFolder(){let x=newFolder.value.trim();if(!x)return;let s=S();if(!s.folders[x])s.folders[x]=[];put(s);newFolder.value='';renderFolderPicker();toast('Folder created')}
function people(q=''){q=q.toLowerCase();plist.innerHTML=P.filter(p=>p[1].includes(q)||p[0].toLowerCase().includes(q)).map((p,i)=>`<div class="person"><div class="av">${p[2]}</div><div class="grow"><b>${p[0]}</b><div class="small">@${p[1]}</div></div>${i<3?`<button class="btn" onclick="openChat('${p[1]}')">Chat</button>`:`<button class="white" onclick="toast('Friend request sent')">Add</button>`}</div>`).join('')}
function openChat(u){who=u;fl.style.display='none';chat.classList.add('on');chatname.textContent='@'+u;msgsRender()}
function closeChat(){fl.style.display='block';chat.classList.remove('on');who=null}
function msgsRender(){let s=S(),a=s.msgs[who]||[{me:0,t:'Send me a good video 👀'},{me:1,t:'Deal. Pirozhok works.'}];msgs.innerHTML=a.map(x=>x.video?`<div class="bubble ${x.me?'me':''}">${x.me?'Sent a video':'Video for you'}<div class="chatVideo" onclick="openVideo('${x.video}')">${(()=>{let v=V.find(v=>v.id===x.video);return v?`<img src="${v.img}"><div><b>${v.title}</b><div class="small">${v.author}</div></div>`:''})()}</div></div>`:`<div class="bubble ${x.me?'me':''}">${esc(x.t)}</div>`).join('');msgs.scrollTop=msgs.scrollHeight}
function sendMsg(e){e.preventDefault();let x=msg.value.trim();if(!x)return;let s=S();(s.msgs[who]??=[]).push({me:1,t:x});put(s);msg.value='';msgsRender()}
function openShare(id){pendingShare=id;sharePeople.innerHTML=P.slice(0,3).map(p=>`<div class="person"><div class="av">${p[2]}</div><div class="grow"><b>${p[0]}</b><div class="small">@${p[1]}</div></div><button class="white" onclick="shareTo('${p[1]}')">Send</button></div>`).join('');shareModal.classList.add('on')}
function shareTo(u){let s=S();(s.msgs[u]??=[]).push({me:1,video:pendingShare});put(s);shareModal.classList.remove('on');toast(`Sent to @${u}`)}
function profile(){let u=U();if(u){pn.textContent=u.name;ph.textContent='@'+u.user;pav.textContent=u.name[0].toUpperCase()}let s=S(),sv=allSaved(s).filter(id=>V.some(v=>v.id===id)),li=Object.keys(s.l).filter(k=>s.l[k]&&V.some(v=>v.id===k));statLikes.textContent=li.length;statSaved.textContent=sv.length;saved.innerHTML=mini(sv,'No saved videos yet');liked.innerHTML=mini(li,'No liked videos yet');folders.innerHTML=Object.entries(s.folders).map(([n,ids])=>`<div class="row folder"><div class="folderIcon">📁</div><div class="grow"><b>${esc(n)}</b><div class="small">${ids.filter(id=>V.some(v=>v.id===id)).length} videos</div></div></div>`).join('')||'<div class="empty">No folders yet</div>'}
function mini(ids,e){let a=ids.map(id=>V.find(v=>v.id===id)).filter(Boolean);return a.length?`<div class="grid">${a.map(card).join('')}</div>`:`<div class="empty">${e}</div>`}
function ptab(b,id){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['saved','liked','folders'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none')}
function renderShorts(){shortFeed.innerHTML=SHORTS.map((s,i)=>`<article class="short" data-id="${s.id}"><video id="v_${s.id}" loop playsinline muted preload="metadata" poster="${s.poster}" src="${s.src}"></video><div class="shade"></div><div class="shortIndex">${i+1} / ${SHORTS.length}</div><button class="sound" onclick="event.stopPropagation();toggleSound('${s.id}')">🔇</button><div class="tapHint" id="hint_${s.id}">▶</div><div class="shorttxt"><b>@${s.author}</b><p>${s.text}</p></div><div class="side"><button id="sl_${s.id}" class="circle" onclick="event.stopPropagation();react('${s.id}','l')">♥</button><div class="count" id="slc_${s.id}"></div><button id="sd_${s.id}" class="circle" onclick="event.stopPropagation();react('${s.id}','d')">↓</button><div class="count" id="sdc_${s.id}"></div><button id="ss_${s.id}" class="circle" onclick="event.stopPropagation();openFolderPicker('${s.id}')">▣</button></div></article>`).join('');SHORTS.forEach(s=>{let el=document.querySelector(`.short[data-id="${s.id}"]`),v=document.getElementById('v_'+s.id);el.addEventListener('click',()=>{if(v.paused){v.play().catch(()=>{});flashHint(s.id,'▶')}else{v.pause();flashHint(s.id,'Ⅱ')}});renderShortButtons(s.id)});setupShortObserver()}
function renderShortButtons(id){let s=S(),sh=SHORTS.find(x=>x.id===id);if(!sh)return;document.getElementById('sl_'+id)?.classList.toggle('on',!!s.l[id]);document.getElementById('sd_'+id)?.classList.toggle('on',!!s.d[id]);document.getElementById('ss_'+id)?.classList.toggle('on',allSaved(s).includes(id));let lc=document.getElementById('slc_'+id),dc=document.getElementById('sdc_'+id);if(lc)lc.textContent=fmt(sh.likes+(s.l[id]?1:0));if(dc)dc.textContent=fmt(sh.dislikes+(s.d[id]?1:0))}
function setupShortObserver(){if(shortObserver)shortObserver.disconnect();shortObserver=new IntersectionObserver(entries=>{entries.forEach(e=>{let v=e.target.querySelector('video');if(e.isIntersecting&&e.intersectionRatio>.72){document.querySelectorAll('.short video').forEach(x=>{if(x!==v)x.pause()});v.muted=!S().shortSound;v.play().catch(()=>{})}else v.pause()})},{root:shortFeed,threshold:[.72]});document.querySelectorAll('.short').forEach(el=>shortObserver.observe(el))}
function toggleSound(id){let s=S();s.shortSound=!s.shortSound;put(s);document.querySelectorAll('.short video').forEach(v=>v.muted=!s.shortSound);document.querySelectorAll('.sound').forEach(b=>b.textContent=s.shortSound?'🔊':'🔇');document.getElementById('v_'+id)?.play().catch(()=>{})}
function flashHint(id,text){let h=document.getElementById('hint_'+id);h.textContent=text;h.classList.add('show');setTimeout(()=>h.classList.remove('show'),280)}
function pauseShorts(){document.querySelectorAll('.short video').forEach(v=>v.pause())}
function U(){try{return JSON.parse(localStorage.pzuser||'null')}catch{return null}}
function register(){if(!name.value.trim()||!user.value.trim()||!email.value.trim()||!pass.value)return toast('Fill all fields');localStorage.pzuser=JSON.stringify({name:name.value.trim(),user:user.value.trim().replace(/^@/,'')});auth.classList.add('hide');profile()}
function demoLogin(){localStorage.pzuser=JSON.stringify({name:'Pirozhok User',user:'pirozhok'});auth.classList.add('hide');profile()}
function logout(){delete localStorage.pzuser;auth.classList.remove('hide')}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400)}
function fmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':n}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));let p=document.getElementById(b.dataset.p);p.classList.add('on');if(b.dataset.p==='profile')profile();if(b.dataset.p==='friends'){pauseShorts();closeChat();people()}else if(b.dataset.p==='shorts'){setTimeout(()=>{let first=document.querySelector('.short video');if(first){first.muted=!S().shortSound;first.play().catch(()=>{})}},50)}else pauseShorts()});
chips();grid();people();profile();renderShorts();if(U())auth.classList.add('hide');
</script>
</body></html>
