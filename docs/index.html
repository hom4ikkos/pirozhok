<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pirozhok Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#08080b;color:#f7f7fa;font:14px system-ui,-apple-system,sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;background:#0c0c11}.top{position:sticky;top:0;z-index:5;padding:16px;background:#0c0c11e8;backdrop-filter:blur(14px);font-size:22px;font-weight:900}.top b{color:#ff9a51}.page{display:none;padding:0 14px 86px}.page.on{display:block}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.chip,.btn{border:1px solid #292934;background:#17171f;color:#ddd;border-radius:999px;padding:8px 11px}.chip.on,.btn.on{background:#fff;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 10px}.card{cursor:pointer}.thumb{aspect-ratio:16/10;border-radius:14px;background:linear-gradient(135deg,#34241c,#171720);position:relative;overflow:hidden}.thumb:nth-child(2n){background:linear-gradient(135deg,#1c2e34,#171720)}.thumb:after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:#fff9}.dur{position:absolute;right:7px;bottom:7px;background:#000b;padding:3px 6px;border-radius:6px;font-size:10px}.t{font-weight:800;margin:7px 0 3px;line-height:1.25}.m{font-size:11px;color:#9292a2}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(4,1fr);background:#0d0d13f2;border-top:1px solid #292934;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:#777;font-size:10px}.nav button.on{color:#fff}.nav span{display:block;font-size:20px;margin-bottom:3px}.short{height:calc(100vh - 145px);min-height:520px;border-radius:18px;background:linear-gradient(160deg,#232333,#131318);position:relative;overflow:hidden}.short video{width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(transparent 55%,#000d)}.shorttxt{position:absolute;left:14px;right:75px;bottom:18px}.side{position:absolute;right:12px;bottom:18px;display:grid;gap:10px}.circle{width:48px;height:48px;border-radius:50%;border:0;background:#1d1d25e8;color:#fff;font-size:20px}.circle.on{background:#fff;color:#111}.search,input{width:100%;background:#15151c;color:#fff;border:1px solid #292934;border-radius:12px;padding:12px}.person{display:flex;align-items:center;gap:10px;padding:11px;background:#15151c;border:1px solid #22222b;border-radius:14px;margin:8px 0}.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#292935;font-weight:900}.grow{flex:1}.small{font-size:12px;color:#9292a2}.profile{text-align:center;padding:24px 0}.profile .av{width:78px;height:78px;margin:auto;font-size:24px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #292934;margin-bottom:12px}.tabs button{border:0;background:none;color:#777;padding:12px}.tabs button.on{color:#fff;border-bottom:2px solid #fff}.row{padding:14px;background:#15151c;border:1px solid #292934;border-radius:13px;margin:8px 0}.overlay{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.on{display:flex}.sheet{width:min(100%,480px);max-height:92vh;overflow:auto;background:#111117;border-radius:22px 22px 0 0;padding:15px}.x{float:right;border:0;border-radius:50%;width:34px;height:34px;background:#24242d;color:#fff}.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;margin-top:10px}.acts{display:flex;gap:8px;overflow:auto;margin:12px 0}.comment{padding:9px 0;border-bottom:1px solid #22222a}.send{display:flex;gap:7px}.send button,.white{border:0;border-radius:11px;background:#fff;color:#111;padding:10px 13px;font-weight:900}.auth{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#3a2116,#09090d 48%)}.auth.hide{display:none}.box{width:min(100%,390px);background:#121218;border:1px solid #292934;border-radius:22px;padding:22px}.box input{margin:5px 0}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 13px;border-radius:999px;z-index:99;display:none;font-size:12px;font-weight:800}.toast.on{display:block}.chat{display:none}.chat.on{display:block}.messages{height:52vh;overflow:auto;padding:10px 0}.bubble{max-width:78%;background:#20202a;padding:9px 11px;border-radius:13px;margin:7px 0}.bubble.me{margin-left:auto;background:#fff;color:#111}
</style></head><body><div class="app"><header class="top">🥟 Piro<b>zhok</b></header><main>
<section id="home" class="page on"><div id="chips" class="chips"></div><h2>New</h2><div id="grid" class="grid"></div></section>
<section id="shorts" class="page"><div class="short"><video id="sv" loop playsinline src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video><div class="shade"></div><div class="shorttxt"><b>@mira</b><p>Shorts demo · tap video to play/pause</p></div><div class="side"><button id="sl" class="circle" onclick="shortReact('l')">♥</button><button id="sd" class="circle" onclick="shortReact('d')">↓</button><button id="ss" class="circle" onclick="save('short')">▣</button></div></div></section>
<section id="friends" class="page"><div id="fl"><h2>Friends</h2><input class="search" placeholder="Search @username" oninput="people(this.value)"><p class="small">Demo chats live only on this device.</p><div id="plist"></div></div><div id="chat" class="chat"><button class="btn" onclick="closeChat()">← Back</button><h3 id="chatname"></h3><div id="msgs" class="messages"></div><form class="send" onsubmit="sendMsg(event)"><input id="msg" placeholder="Message…"><button>Send</button></form></div></section>
<section id="profile" class="page"><div class="profile"><div id="pav" class="av">P</div><h2 id="pn">Pirozhok User</h2><div id="ph" class="small">@pirozhok</div></div><div class="tabs"><button class="on" onclick="ptab(this,'saved')">Saved</button><button onclick="ptab(this,'liked')">Likes</button><button onclick="ptab(this,'folders')">Folders</button></div><div id="saved"></div><div id="liked" style="display:none"></div><div id="folders" style="display:none"></div><div class="row">⚙ Settings <span class="small">(later)</span></div><div class="row" onclick="logout()">Log out</div></section>
</main></div><nav class="nav"><button class="on" data-p="home"><span>⌂</span>Home</button><button data-p="shorts"><span>▶</span>Shorts</button><button data-p="friends"><span>☺</span>Friends</button><button data-p="profile"><span>●</span>Profile</button></nav>
<div id="video" class="overlay"><div class="sheet"><button class="x" onclick="closeVideo()">×</button><div id="detail"></div></div></div><div id="toast" class="toast"></div>
<div id="auth" class="auth"><div class="box"><h1>🥟 Pirozhok</h1><p class="small">Local demo account — no email confirmation.</p><input id="name" placeholder="Display name"><input id="user" placeholder="Username"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="white" style="width:100%;margin-top:8px" onclick="register()">Create account</button><button class="btn" style="width:100%;margin-top:8px" onclick="demoLogin()">Use demo login</button></div></div>
<script>
const V=[['1','Category 1','First Pirozhok upload','Mira Lane','@mira','8:24',842,13],['2','Category 2','Building something weird','Alex North','@alex','14:02',504,21],['3','Category 3','Night city walk','Noah Gray','@noah','42:10',2204,47],['4','Category 1','Tiny studio, big ideas','Mira Lane','@mira','11:37',318,8],['5','Category 4','Why this UI feels fast','Lena Fox','@lena','6:55',1290,32],['6','Category 5','The weekend experiment','Alex North','@alex','23:18',733,17]];
const P=[['Mira Lane','mira','M'],['Alex North','alex','A'],['Noah Gray','noah','N'],['Lena Fox','lena','L']];let cat='All',cur=null,who=null;const S=()=>JSON.parse(localStorage.pzstate||'{"l":{},"d":{},"save":{},"comments":{},"msgs":{}}');const put=s=>(localStorage.pzstate=JSON.stringify(s),profile());
function chips(){let a=['All','Category 1','Category 2','Category 3','Category 4','Category 5'];chipsEl.innerHTML=a.map(x=>`<button class="chip ${x==cat?'on':''}" onclick="cat='${x}';chips();grid()">${x}</button>`).join('')}const chipsEl=document.getElementById('chips');
function grid(){let a=cat=='All'?V:V.filter(v=>v[1]==cat);document.getElementById('grid').innerHTML=a.map(v=>`<div class="card" onclick="openVideo('${v[0]}')"><div class="thumb"><span class="dur">${v[5]}</span></div><div class="t">${v[2]}</div><div class="m">${v[3]} · ${Math.floor(v[6]/10)}K views</div></div>`).join('')}
function openVideo(id){cur=id;let v=V.find(x=>x[0]==id),s=S(),cs=s.comments[id]||[];detail.innerHTML=`<video class="player" controls playsinline src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video><h2>${v[2]}</h2><div class="m">12K views · ${v[1]}</div><div class="row"><b>${v[3]}</b><div class="m">${v[4]}</div></div><div class="acts"><button class="btn ${s.l[id]?'on':''}" onclick="react('${id}','l')">♥ ${v[6]+(s.l[id]?1:0)}</button><button class="btn ${s.d[id]?'on':''}" onclick="react('${id}','d')">↓ ${v[7]+(s.d[id]?1:0)}</button><button class="btn ${s.save[id]?'on':''}" onclick="save('${id}')">▣ Save</button></div><h3>Comments</h3><form class="send" onsubmit="comment(event,'${id}')"><input id="ci" placeholder="Add comment"><button>Post</button></form>${cs.map(c=>`<div class="comment"><b>${c.n}</b><div>${esc(c.t)}</div></div>`).join('')}`;video.classList.add('on')}
function closeVideo(){video.classList.remove('on')}function react(id,t){let s=S();s[t][id]=!s[t][id];if(s[t][id])delete s[t=='l'?'d':'l'][id];put(s);openVideo(id)}function save(id){let s=S();s.save[id]=!s.save[id];put(s);toast(s.save[id]?'Saved':'Removed');if(cur==id)openVideo(id)}
function comment(e,id){e.preventDefault();let x=ci.value.trim();if(!x)return;let s=S();(s.comments[id]??=[]).unshift({n:U()?.name||'You',t:x});put(s);openVideo(id)}
function people(q=''){q=q.toLowerCase();plist.innerHTML=P.filter(p=>p[1].includes(q)||p[0].toLowerCase().includes(q)).map((p,i)=>`<div class="person"><div class="av">${p[2]}</div><div class="grow"><b>${p[0]}</b><div class="small">@${p[1]}</div></div>${i<3?`<button class="btn" onclick="openChat('${p[1]}')">Chat</button>`:`<button class="white" onclick="toast('Friend request sent')">Add</button>`}</div>`).join('')}
function openChat(u){who=u;fl.style.display='none';chat.classList.add('on');chatname.textContent='@'+u;msgsRender()}function closeChat(){fl.style.display='block';chat.classList.remove('on');who=null}function msgsRender(){let s=S(),a=s.msgs[who]||[{me:0,t:'Send me a good video 👀'},{me:1,t:'Deal. Pirozhok works.'}];msgs.innerHTML=a.map(x=>`<div class="bubble ${x.me?'me':''}">${esc(x.t)}</div>`).join('');msgs.scrollTop=msgs.scrollHeight}function sendMsg(e){e.preventDefault();let x=msg.value.trim();if(!x)return;let s=S();(s.msgs[who]??=[]).push({me:1,t:x});put(s);msg.value='';msgsRender()}
function profile(){let u=U();if(u){pn.textContent=u.name;ph.textContent='@'+u.user;pav.textContent=u.name[0].toUpperCase()}let s=S(),sv=Object.keys(s.save).filter(k=>s.save[k]),li=Object.keys(s.l).filter(k=>s.l[k]);saved.innerHTML=mini(sv,'No saved videos yet');liked.innerHTML=mini(li,'No liked videos yet');folders.innerHTML=`<div class="row">📁 Favorites <span class="small">· ${sv.length} items</span></div>`}function mini(ids,e){let a=ids.map(id=>V.find(v=>v[0]==id)).filter(Boolean);return a.length?`<div class="grid">${a.map(v=>`<div class="card" onclick="openVideo('${v[0]}')"><div class="thumb"><span class="dur">${v[5]}</span></div><div class="t">${v[2]}</div></div>`).join('')}</div>`:`<div class="row small">${e}</div>`}function ptab(b,id){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['saved','liked','folders'].forEach(x=>document.getElementById(x).style.display=x==id?'block':'none')}
function shortReact(t){let s=S(),id='short';s[t][id]=!s[t][id];if(s[t][id])delete s[t=='l'?'d':'l'][id];put(s);shortState()}function shortState(){let s=S();sl.classList.toggle('on',!!s.l.short);sd.classList.toggle('on',!!s.d.short);ss.classList.toggle('on',!!s.save.short)}sv.onclick=()=>sv.paused?sv.play():sv.pause();
function U(){return JSON.parse(localStorage.pzuser||'null')}function register(){if(!name.value.trim()||!user.value.trim()||!email.value.trim()||!pass.value)return toast('Fill all fields');localStorage.pzuser=JSON.stringify({name:name.value.trim(),user:user.value.trim().replace(/^@/,'')});auth.classList.add('hide');profile()}function demoLogin(){localStorage.pzuser=JSON.stringify({name:'Pirozhok User',user:'pirozhok'});auth.classList.add('hide');profile()}function logout(){delete localStorage.pzuser;auth.classList.remove('hide')}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1300)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(b.dataset.p).classList.add('on');if(b.dataset.p=='profile')profile();if(b.dataset.p=='friends'){closeChat();people()}if(b.dataset.p=='shorts')shortState()});chips();grid();people();profile();shortState();if(U())auth.classList.add('hide');
</script></body></html>
